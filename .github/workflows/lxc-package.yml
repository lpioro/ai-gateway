name: Native LXC package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
          python -m compileall -q app
          bash -n scripts/install-lxc.sh
      - name: Build native LXC tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage/ai-gateway
          cp -a app requirements.txt scripts README.md .env.example dist/stage/ai-gateway/
          if [[ -f LICENSE ]]; then cp LICENSE dist/stage/ai-gateway/; fi
          tar -C dist/stage -czf "dist/ai-gateway-lxc-${GITHUB_SHA:0:7}.tar.gz" ai-gateway
          (cd dist && sha256sum ai-gateway-lxc-*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-lxc-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish release assets on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --title "AI Gateway ${GITHUB_REF_NAME}" --generate-notes
