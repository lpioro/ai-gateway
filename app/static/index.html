<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Gateway LAN</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#17191f;color:#f2f3f6;font:15px system-ui,Arial;display:flex;height:100dvh}aside{width:260px;background:#111318;display:flex;flex-direction:column;padding:18px;gap:14px;border-right:1px solid #333}h2{margin:0;font-size:19px}button,select,input,textarea{font:inherit}button{cursor:pointer;background:#292f39;color:white;border:1px solid #454b57;border-radius:10px;padding:10px}button:hover{background:#394252}#chats{overflow:auto;flex:1}.chat{width:100%;text-align:left;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{flex:1;min-width:0;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #353942}select,input{background:#262b34;color:white;border:1px solid #444b56;border-radius:9px;padding:9px}#password{max-width:170px}#conversation{flex:1;overflow:auto;padding:30px max(16px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:20px}.msg{line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#313945;border-radius:16px;padding:12px 16px;max-width:85%}.assistant{align-self:stretch}.assistant:before{content:'AI';display:inline-block;color:#6ee7b7;margin-right:12px;font-weight:bold}.composer{padding:15px max(12px,calc((100% - 900px)/2)) 20px}form{display:flex;gap:10px;background:#292e37;border-radius:15px;padding:10px}textarea{resize:vertical;flex:1;min-height:55px;background:transparent;color:white;border:none;outline:none}#send{background:#087e69;border:0}#status{font-size:12px;color:#9da8ba;text-align:center;margin-top:10px}@media(max-width:700px){aside{width:140px;padding:8px}header{gap:6px}#password{max-width:110px}#conversation{padding:20px 10px}}
</style></head><body>
<aside><h2>◈ AI Gateway</h2><button id="new">＋ Nowa rozmowa</button><div id="chats"></div><small>LAN · prywatna historia</small></aside>
<main><header><strong>AI Gateway</strong><select id="model"><option value="ollama">ollama</option></select><label><input id="local" type="checkbox"> Tylko lokalnie</label><input id="password" type="password" placeholder="Hasło"><button id="connect">Połącz</button></header>
<section id="conversation"><div class="msg assistant">Wybierz model i rozpocznij rozmowę.</div></section>
<div class="composer"><form id="form"><textarea id="prompt" required placeholder="Napisz wiadomość…"></textarea><button id="send" type="submit">Wyślij</button></form><div id="status">Modele chmurowe wysyłają treść rozmowy poza LAN.</div></div></main>
<script>
const $=id=>document.getElementById(id);let cid=null,busy=false;
function api(path,opt={}){return fetch(path,{...opt,headers:{'X-Gateway-Password':$('password').value,...opt.headers}})}
function say(role,txt=''){const e=document.createElement('div');e.className='msg '+role;if(role==='assistant'){const s=document.createElement('span');s.textContent=txt;e.append(s)}else e.textContent=txt;$('conversation').append(e);$('conversation').scrollTop=$('conversation').scrollHeight;return role==='assistant'?e.querySelector('span'):e}
function status(s){$('status').textContent=s}
function reset(){cid=null;$('conversation').replaceChildren();say('assistant','W czym mogę pomóc?')}
async function list(){const r=await api('/api/chats');if(!r.ok)throw Error('Błąd listy rozmów');$('chats').replaceChildren();for(const c of await r.json()){const b=document.createElement('button');b.className='chat';b.textContent=c.title;b.onclick=async()=>{const a=await api('/api/chats/'+encodeURIComponent(c.id));if(!a.ok)return;cid=c.id;$('conversation').replaceChildren();for(const m of await a.json())say(m.role,m.content)};$('chats').append(b)}}
$('new').onclick=reset;
$('local').onchange=()=>{for(const o of $('model').options)o.disabled=$('local').checked&&o.value!=='ollama';if($('local').checked)$('model').value='ollama'};
$('connect').onclick=async()=>{try{const r=await api('/api/models');if(!r.ok)throw Error('Brak dostępu: '+r.status);$('model').replaceChildren();for(const m of await r.json()){let o=document.createElement('option');o.value=m.provider;o.textContent=m.provider+' · '+m.model+(m.configured?'':' (brak klucza)');o.disabled=!m.configured||($('local').checked&&m.provider!=='ollama');$('model').append(o)}await list();status('Połączono')}catch(e){status(e.message)}};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const prompt=$('prompt').value.trim();if(!prompt)return;busy=true;$('send').disabled=true;$('prompt').value='';say('user',prompt);const out=say('assistant');status('Generowanie…');try{const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:cid,provider:$('model').value,message:prompt,local_only:$('local').checked})});if(!r.ok){const d=await r.json();throw Error(d.detail||'HTTP '+r.status)}const reader=r.body.getReader(),decoder=new TextDecoder();let buf='';while(true){const x=await reader.read();if(x.done)break;buf+=decoder.decode(x.value,{stream:true});let n;while((n=buf.indexOf('\n\n'))>=0){const part=buf.slice(0,n);buf=buf.slice(n+2);for(const line of part.split('\n'))if(line.startsWith('data: ')){const ev=JSON.parse(line.slice(6));if(ev.type==='chat_id')cid=ev.chat_id;if(ev.type==='delta'){out.textContent+=ev.content;$('conversation').scrollTop=$('conversation').scrollHeight}if(ev.type==='error')throw Error(ev.message)}}}await list();status('Gotowe')}catch(e){out.textContent+='\nBłąd: '+e.message;status(e.message)}finally{busy=false;$('send').disabled=false}};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
</script></body></html>
